<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добей фразу — игра для компании</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise-layer"></div>
  <div class="decor-chip chip-one">socket connected</div>
  <div class="decor-chip chip-two">lobby://XXAW</div>
  <div class="decor-chip chip-three">punchline pending</div>
  <div class="decor-chip chip-four">npm run room</div>
  <div class="decor-bubble bubble-one">new joke()</div>
  <div class="decor-bubble bubble-two">chat locked</div>

  <main class="app">
    <section class="hero">
      <p class="eyebrow">игра для друзей</p>
      <h1>Добей фразу</h1>
      <p class="subtitle">придумывайте начала фраз, дописывайте смешные концовки и выбирайте лучшие шутки вечера</p>
    </section>

    <section id="app" class="game-card"></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
